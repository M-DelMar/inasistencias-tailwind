<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex items-start gap-3">
        <input type="checkbox" id="terminos"
            class="w-4 h-4 mt-1 rounded bg-slate-950 border-slate-700 accent-cyan-400 cursor-pointer">
        <label for="terminos" class="text-xs text-slate-400 leading-normal cursor-pointer">
            Acepto los <a href="#" class="text-cyan-400 underline hover:text-cyan-300">Términos de Servicio de
                Quantum</a> y las políticas de encriptación de datos.
        </label>
    </div>
    <!-- Input en Estado de Error -->
    <div>
        <label class="block text-xs font-semibold text-rose-400 uppercase tracking-wider mb-2">
            Contraseña
        </label>
        <input type="password" class="w-full bg-slate-950/80 border border-rose-500 rounded-xl px-4 py-3 text-white text-sm 
        focus:outline-none focus:ring-2 focus:ring-rose-500/20" value="123">
        <!-- Mensaje de error -->
        <p class="text-xs text-rose-400 mt-1.5 flex items-center gap-1">
            ⚠️ La contraseña debe tener al menos 8 caracteres.
        </p>
    </div>
</body>
</html>

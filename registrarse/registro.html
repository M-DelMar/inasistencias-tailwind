<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<nav class="max-w-xl mx-auto px-7 py-12 p-6">
    <div class="items-center justify-between shadow-boton rounded-3xl">
<div>
    <div class="w-full max-w-md bg-[#EDE9FE] backdrop-blur-xl 
    rounded-3xl p-8 shadow-2xl shadow-[#C898F5]">
        <a href="../index.html" class="absolute top-5 left-5 text-2xl text-blue-900 hover:scale-110">
        ←
        </a>
        <div class="text-center mb-6">
            <div class="mb-6 m-2">
                
                <img src="logoo.png" alt="logo inasisitencias" class="w-40 h-40 mx-auto rounded-3xl">
            </div>
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Bienvenido</h2>
            <p class="text-1xl texte-center text-slate-700 mt-5">Registrate en control de inasisitencias</p>
        </div>
        <!-- Formulario -->
        <form class="space-y-5">
            <!-- Nombre -->
            <div>
                <label class="block text-xs font-semibold text-slate-800 uppercase tracking-wider mb-2">
                    Nombres y apellidos </label>
                <input type="text" placeholder="Ingresa tu nombre" class="w-full bg-slate border border-slate-200 rounded-xl px-4 py-3 text-black placeholder-slate-500 text-sm focus:outline-none 
                        focus:border-morado-100 focus:ring-1 focus:ring-morado-400 transition-all duration-200">
            </div>
            <!--correo electronico-->
            <div>
                <label class="block text-xs font-semibold text-slate-800 uppercase tracking-wider mb-2">
                    Correo electronico</label>
                <input type="email" placeholder="Ingresa tu correo electronico" class="w-full bg-slate border border-slate-200 rounded-xl px-4 py-3 text-black placeholder-slate-500 text-sm focus:outline-none 
                        focus:border-morado-100 focus:ring-1 focus:ring-morado-400 transition-all duration-200">
            </div>
            <!-- Número de documento -->
            <div>
                <label class="block text-xs font-semibold text-slate-800 uppercase tracking-wider mb-2">
                    Número de documento</label>
                <input type="text" placeholder="Ingresa tu número de documento" class="w-full bg-slate border border-slate-200 rounded-xl px-4 py-3 text-black placeholder-slate-500 text-sm focus:outline-none 
                        focus:border-morado-100 focus:ring-1 focus:ring-morado-400 transition-all duration-200">
            </div>
        
            <!-- Campo Contraseña -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-800 uppercase tracking-wider">
                        Contraseña</label>
                </div>
                <input type="password" placeholder="Contraseña" class="w-full bg-slate border border-slate-200 rounded-xl px-4 py-3 text-black placeholder-slate-500 text-sm focus:outline-none 
                        focus:border-morado-100 focus:ring-1 focus:ring-morado-400 transition-all duration-200">
            </div>
        
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-800 uppercase tracking-wider">
                        Confirmar contraseña</label>
                </div>
                <input type="password" placeholder="Confirmar contraseña" class="w-full bg-slate border border-slate-200 rounded-xl px-4 py-3 text-black placeholder-slate-500 text-sm focus:outline-none 
                        focus:border-morado-100 focus:ring-1 focus:ring-morado-400 transition-all duration-200">
                <!--chek-->
                <div class="flex items-start gap-3">
                    <input type="checkbox" id="terminos"
                        class="w-4 h-4 mt-4 rounded bg-slate-950 border-slate-700 cursor-pointer">
                    <label for="terminos" class="text-xs mt-4 text-slate-500 cursor-pointer">
                        Acepto los <a href="#" class="text-purple-400 underline hover:text-purple-300">Terminos y
                            conciones</a>
                        y la <a href="#" class="text-purple-400 underline hover:text-purple-300">política de
                            privacidad.</a>
                    </label>
                </div>
            </div>
        
            <!-- Botón -->
            <button type="submit" class="w-full bg-[#000081] hover:bg-indigo-500 text-white font-bold py-2.5 px-3 rounded-lg 
                    shadow-lg shadow-purple-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
                Registrarme
            </button>
            <div class="flex items-center w-full my-8 gap-4">
                <div class="flex-1 h-px bg-gray-400">
                </div>
                <span class="text-sm text-black">
                    ¿Ya tienes una cuenta?
                </span>
                <div class="flex-1 h-px bg-gray-400"></div>
            </div>
            <div class="text-center">
                <a href="../login.html"
                    class=" w-full bg-[#000081] hover:bg-indigo-500 text-white font-bold py-2.5 px-3 rounded-lg 
                        shadow-lg shadow-purple-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
                    iniciar sesión
                </a>
            </div>
            </body>
        
        </form>
        </div>
        </body>
        </html>
